site_name: OpenImport
site_description: Import and export for Magento 2 with profiles, mapping, dry run, schedules and SFTP. Free, MIT, built on Magento's own import engine.
site_url: https://iranimij.github.io/openimport/
repo_url: https://github.com/iranimij/openimport
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
nav:
  - Home: index.md
  - File formats: file-formats.md
  - Transforms and expressions: transforms.md
  - Mapping and filters: mapping.md
  - Runs, dry runs and safety: runs.md
  - Command line: cli.md
  - Admin: admin.md
  - Developers:
      - Core bridge: core-bridge.md
      - Core facts: core-facts.md
theme:
  name: readthedocs
markdown_extensions:
  - tables
  - toc:
      permalink: true
