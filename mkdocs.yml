site_name: OpenImport
site_description: Import and export for Magento 2 with profiles, mapping, dry run, schedules and SFTP. Free, MIT, built on Magento's own import engine.
site_url: https://iranimij.github.io/openimport/
repo_url: https://github.com/iranimij/openimport
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
nav:
  - Home: index.md
  - How it compares: comparison.md
  - File formats: file-formats.md
  - Transforms and expressions: transforms.md
  - Mapping and filters: mapping.md
  - Runs, dry runs and safety: runs.md
  - Sources: sources.md
  - Product pictures: images.md
  - Configurable products: configurable.md
  - Products missing from the file: missing-products.md
  - Quantities as changes: stock-changes.md
  - URL keys and redirects: url-keys.md
  - Presets (Shopify, WooCommerce, Magento 1): presets.md
  - Exports: exports.md
  - Categories: categories.md
  - Attributes: attributes.md
  - CMS pages and blocks: cms.md
  - Schedules and cron: schedules.md
  - Command line: cli.md
  - REST API and triggers: api.md
  - Admin: admin.md
  - Security: security.md
  - Developers:
      - Core bridge: core-bridge.md
      - Core facts: core-facts.md
      - Baseline: baseline.md
theme:
  name: readthedocs
markdown_extensions:
  - tables
  - toc:
      permalink: true
