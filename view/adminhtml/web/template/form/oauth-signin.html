<div class="admin__field openimport-oauth-signin" visible="visible">
    <div class="admin__field-label">
        <span translate="'Account'"></span>
    </div>
    <div class="admin__field-control">
        <p if="account">
            <span translate="'Signed in as'"></span>
            <strong text="account"></strong>
        </p>
        <a if="signInUrl" class="action-secondary" attr="href: signInUrl">
            <span text="$t('Sign in with %1').replace('%1', service())"></span>
        </a>
        <p if="!signInUrl" class="note" translate="'Save the connection with its client ID and client secret, then sign in.'"></p>
    </div>
</div>
