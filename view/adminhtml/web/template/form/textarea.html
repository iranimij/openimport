<textarea class="admin__control-textarea" rows="8" spellcheck="false"
          data-bind="
            event: {change: userChanges},
            value: value,
            hasFocus: focused,
            valueUpdate: valueUpdate,
            attr: {
                name: inputName,
                placeholder: placeholder,
                'aria-describedby': noticeId,
                id: uid,
                disabled: disabled,
                autocomplete: 'off'
            }"></textarea>
